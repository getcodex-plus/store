name: 改进建议
description: 提出使用场景和期望改进
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述当前使用场景、遇到的限制和影响
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述改进后的操作流程或结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
