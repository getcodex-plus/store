name: Docker

on:
  release:
    types: [published, released]

permissions:
  contents: read

# Serialize updates to the shared prereleased/latest tags across versions.
concurrency:
  group: ghcr-release
  queue: max

jobs:
  publish:
    name: Publish multi-platform image to GHCR
    # published covers draft prereleases; released covers stable releases and promotions.
    if: github.event.action == 'released' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release and set image name
        id: image
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          [[ "$TAG" == v* ]]
          bash scripts/check-release-version.sh "${TAG#v}" "$PRERELEASE"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Validate GHCR credential pair
        env:
          CREDENTIALS_MISMATCH: ${{ (vars.GHCR_USERNAME != '') != (secrets.GHCR_TOKEN != '') }}
        run: |
          if [[ "$CREDENTIALS_MISMATCH" == true ]]; then
            echo "::error::Set both the GHCR_USERNAME variable and GHCR_TOKEN secret, or leave both unset to use GITHUB_TOKEN."
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=prereleased
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=GetCodex Plus Store
            org.opencontainers.image.description=Self-hosted ChatGPT recharge storefront with Dujiao-Next procurement and AICDK fulfillment
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID || '' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=getcodex-plus
          cache-to: type=gha,mode=max,scope=getcodex-plus
      - name: Report published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published GHCR image"
            echo
            echo '```text'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            printf "Digest: \`%s@%s\`\n" "$IMAGE" "$DIGEST"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
