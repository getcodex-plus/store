# Attach only the web service to your existing Traefik network.
# When Cloudflare or another proxy sits in front of Traefik, set TRUSTED_PROXIES in .env
# to the Traefik/CDN CIDRs so multi-hop X-Forwarded-For preserves client IPs for rate limits.
services:
  web:
    networks: [backend, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'
      traefik.http.routers.getcodex-plus.rule: 'Host(`${APP_DOMAIN:?Set APP_DOMAIN}`)'
      traefik.http.routers.getcodex-plus.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.getcodex-plus.tls: 'true'
      traefik.http.routers.getcodex-plus.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      traefik.http.services.getcodex-plus.loadbalancer.server.port: '3000'
networks:
  traefik:
    external: true
    name: '${TRAEFIK_NETWORK:-traefik}'
