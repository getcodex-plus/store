x-environment: &environment
  APP_MODE: '${APP_MODE:-live}'
  APP_URL: '${APP_URL:?Set APP_URL}'
  DATABASE_URL: '${DATABASE_URL:-postgresql://getgpt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/getgpt}'
  ADMIN_EMAIL: '${ADMIN_EMAIL:?Set ADMIN_EMAIL}'
  ENCRYPTION_KEY: '${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}'
  AICDK_WEBHOOK_ENABLED: '${AICDK_WEBHOOK_ENABLED:-false}'
  AICDK_WEBHOOK_SECRET: '${AICDK_WEBHOOK_SECRET:-}'
  BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}'
  OPAQUE_SERVER_KEY: '${OPAQUE_SERVER_KEY:-}'
  OPAQUE_SERVER_KEY_FILE: '${OPAQUE_SERVER_KEY_FILE:-}'
  GOOGLE_SITE_VERIFICATION: '${GOOGLE_SITE_VERIFICATION:-}'
  BING_SITE_VERIFICATION: '${BING_SITE_VERIFICATION:-}'
  NEXT_PUBLIC_GA_ID: '${NEXT_PUBLIC_GA_ID:-}'
  TZ: '${TZ:-}'

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-app: &app
  image: '${GETCODEX_IMAGE:-getcodex-plus:local}'
  build:
    context: .
    args:
      NEXT_PUBLIC_GA_ID: '${NEXT_PUBLIC_GA_ID:-}'
  environment: *environment
  tmpfs:
    - /tmp
    - /app/.next/cache:uid=1000,gid=1000
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  networks: [backend]
  logging: *logging

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: getgpt
      POSTGRES_USER: getgpt
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getgpt -d getgpt']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *app
    command: [web]
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000']
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    <<: *app
    command: [worker]
    stop_grace_period: 140s
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
networks:
  backend:
